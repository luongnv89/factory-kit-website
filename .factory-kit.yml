# .factory-kit.yml — factory-kit project manifest (schema v1)
#
# The dogfood registration for the factory-kit landing page. This file is
# repo-reviewed policy: it names who may opt work in, which runtime and
# models run it, what counts as verified, and how merges are approved.

factory_kit: 1

identity:
  repo_id: "R_kgDOU9xrUg"
  owner: luongnv89
  name: factory-kit-website

registration:
  owner: luongnv89

# Only luongnv89 may opt issues in. Telegram allowlists stay empty
# (deny-all): merge approvals come from the local operator CLI instead.
authorization:
  execution_opt_in: true
  github_actors: [luongnv89]
  github_roles: [admin]
  telegram_users: []
  telegram_chats: []

runtime:
  name: hermes-kanban
  roles:
    implementation:
      model: "openai-codex/gpt-6-luna"
      profile: fk-impl
    review:
      model: "openai-codex/gpt-6-luna"
      profile: fk-review
  tools:
    allow: [git, gh, hermes, node, npm]
    deny: []
  capabilities:
    allow: [workspace.scratch, workspace.worktree]
    deny: [workspace.dir-ambient]

skills:
  auto_discover: false
  approved:
    issue-resolver: "0.20.0"
    issue-pr-review: "2.8.0"

verification:
  acceptance_commands:
    - "npm ci && npm run format:check && npm run lint && npm run typecheck && npm test && npm run build"
  required_checks:
    provider: github
    contexts: ["Code Quality & Build", "Security Scan"]
    conclusions: [success]

limits:
  active_tasks: 1
  implementation_attempts: 2
  active_worker_minutes: 60
  wall_hours: 24

evidence:
  observation_freshness_minutes: 15
  event_retention_days: 30
  worker_log_retention_days: 7
  audit_retention_days: 30
  export:
    aggregate_only: true
    redact: [issue_body, code, usernames, tokens, chat_text]
  tombstones:
    retain_until_registration_removal: true

secrets:
  webhook_signing_key: "env:FACTORY_KIT_WEBHOOK_SECRET"

# One GitHub Pages preview per verified head: the controller builds the
# exact reviewed commit with SITE_BASE set to the preview sub-path and
# publishes it under /previews/<preview_id>/ on the gh-pages branch, then
# smoke-tests it for HTTP 200 plus the layout's factory-kit-smoke marker.
# Pages sites are public, so the visibility is recorded as public. Smoke
# evidence may be up to 30 minutes old at merge (schema bound 1-30) to
# leave room for a human review of the preview; approvals still expire
# after 60 minutes.
endpoint:
  preview:
    provider: github-pages
    environment: preview
    visibility: public
    ttl_hours: 24
    cleanup_minutes: 60
    build:
      commands: ["npm ci", "npm run build"]
      output_dir: dist
      base_env: SITE_BASE
    smoke:
      command: "curl -fsS -o /dev/null -w '%{http_code}' {url}"
      expect: "200"
      marker: "factory-kit-smoke"
  merge:
    method: squash
    approval_expiry_minutes: 60
    max_smoke_age_minutes: 30
    approval_channels: [operator-cli]
  disabled: [production_deploy, package_publish, autonomous_merge]
